name: gorush_driver
description: "GoRush Driver Partner Application - Real-time dispatch, navigation, and earnings"
publish_to: "none"
version: 1.0.0+5001

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  dio: ^5.4.3+1
  intl: ^0.19.0
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.5.5
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  file_picker: ^10.3.8
  google_maps_flutter: ^2.10.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  razorpay_flutter: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
